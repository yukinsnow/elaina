[package]
name = "elaina"
version = "2.1.0"
description = "local video and audio toolkit"
authors = ["yukinsnow"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[profile.release]
lto = true
codegen-units = 1
strip = true
