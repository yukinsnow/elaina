name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            bundles: nsis
          - os: macos-latest
            name: macos
            bundles: dmg
          - os: ubuntu-22.04
            name: linux
            bundles: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: install linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --bundles ${{ matrix.bundles }}
      - name: package windows portable
        if: matrix.name == 'windows'
        shell: pwsh
        run: ./scripts/package-portable.ps1
      - name: test bundled media processing
        if: matrix.name == 'windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml ffmpeg_roundtrip -- --ignored
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'windows'
        with:
          name: elaina-windows-portable
          path: artifacts/elaina-*-windows-x64-portable.zip*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: elaina-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'linux'
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
